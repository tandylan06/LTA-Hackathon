kind = "web"
previewPath = "/"
title = "TrackAccess Optimiser"
description = "A railway works-planning tool that uploads network CSVs, generates feasible possession schedules for Scenarios A, B, and C, validates safety constraints, and explains the timeline and trade-offs to works controllers."
version = "1.0.0"
id = "artifacts/trackaccess-optimiser"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21622

[services.development]
run = "pnpm --filter @workspace/trackaccess-optimiser run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trackaccess-optimiser", "run", "build" ]
serve = "static"
publicDir = "artifacts/trackaccess-optimiser/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21622"
BASE_PATH = "/"
